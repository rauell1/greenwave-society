name: Event reminders

# Sends the 24-hour reminder email to people registered for upcoming events.
# Needs the repository secret CRON_SECRET to match the CRON_SECRET set in Vercel.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set; skipping."; exit 0; fi
          curl --fail-with-body -sS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://greenwavesociety.org/api/cron/event-reminders
