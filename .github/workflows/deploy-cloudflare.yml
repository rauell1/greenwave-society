name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The logos, favicons, certificates and downloads in public/ are Git
          # LFS files; without this the site ships their 130-byte pointers.
          lfs: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          # The build prerenders pages, so it reads the production database.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          IMAGE_CDN_ORIGIN: ${{ vars.IMAGE_CDN_ORIGIN }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ENABLE_ANALYTICS: ${{ vars.NEXT_PUBLIC_ENABLE_ANALYTICS }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      # Shows whether the token Cloudflare receives is valid (token ID and
      # status from Cloudflare, plus its length and whether it holds spaces or
      # line breaks). The token itself is never printed.
      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          t="$CLOUDFLARE_API_TOKEN"
          echo "length: ${#t}"
          case "$t" in *[[:space:]]*) echo "contains whitespace: yes";; *) echo "contains whitespace: no";; esac
          case "$t" in Bearer*|bearer*) echo "starts with Bearer: yes";; *) echo "starts with Bearer: no";; esac
          curl -s -H "Authorization: Bearer $t" https://api.cloudflare.com/client/v4/user/tokens/verify \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); print("verify:", r.get("success"), (r.get("result") or {}).get("id"), (r.get("result") or {}).get("status"), [e.get("code") for e in r.get("errors") or []], [e.get("message") for e in r.get("errors") or []])'
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The account ID is not a secret (also in wrangler.jsonc). Set here so
          # a wrong CLOUDFLARE_ACCOUNT_ID repository secret cannot break a deploy.
          CLOUDFLARE_ACCOUNT_ID: 0ea45b97dde8b01ea8d1a07fd58165c9
